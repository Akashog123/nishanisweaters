name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_convex:
        description: 'Deploy Convex backend'
        required: true
        default: 'true'
        type: boolean

env:
  CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run

  deploy-convex:
    name: Deploy Convex Backend
    runs-on: ubuntu-latest
    needs: test
    if: github.event.inputs.deploy_convex != 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Convex
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  # Vercel deployment is handled automatically via Vercel's Git integration
  # This job just notifies about the deployment status
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [test, deploy-convex]
    if: always()

    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.deploy-convex.result }}" == "success" ]; then
            echo "✅ All deployments succeeded!"
            exit 0
          else
            echo "❌ Some deployments failed"
            echo "Tests: ${{ needs.test.result }}"
            echo "Convex: ${{ needs.deploy-convex.result }}"
            exit 1
          fi
