name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_convex:
        description: 'Deploy Convex backend'
        required: true
        default: 'true'
        type: boolean

env:
  CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

jobs:
  # Vercel handles frontend deployment automatically via Git integration
  # This workflow only handles Convex backend deployment

  deploy-convex:
    name: Deploy Convex Backend
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_convex != 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Convex
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  # Optional: Run security audit weekly instead of on every push
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Run manually or weekly on schedule
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
