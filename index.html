    <!--
      SECURITY: Content Security Policy (CSP)
      =========================================================================
      CSP provides defense-in-depth against XSS and data injection attacks.

      Directives explained:
      - default-src 'self': Only allow resources from same origin by default
      - script-src: Allow scripts from self, inline (required for React/Vite), Razorpay, and Clerk
      - script-src-elem: Explicit directive for script elements (some browsers require this)
      - connect-src: Allow API calls to Convex, Clerk auth, and Razorpay
      - img-src: Allow images from self, data URIs, HTTPS sources (CDNs, user avatars)
      - style-src: Allow styles from self, inline (required for styled-components/Tailwind)
      - font-src: Allow fonts from self and Google Fonts
      - frame-src: Allow iframes from Razorpay checkout and Clerk (for auth modals)
      - base-uri: Restrict base element to prevent base tag hijacking
      - form-action: Restrict form submissions to same origin
      - object-src: Disallow plugins (Flash, Java, etc.)
      - upgrade-insecure-requests: Auto-upgrade HTTP to HTTPS
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.convex.cloud https://*.convex.dev https://checkout.razorpay.com https://*.clerk.accounts.dev https://*.clerk.com https://clerk.nidhiclothing.com https://challenges.cloudflare.com;
      script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' https://*.convex.cloud https://*.convex.dev https://checkout.razorpay.com https://*.clerk.accounts.dev https://*.clerk.com https://clerk.nidhiclothing.com https://challenges.cloudflare.com;
      connect-src 'self' https://*.convex.cloud https://*.convex.dev wss://*.convex.cloud wss://*.convex.dev https://*.clerk.accounts.dev https://*.clerk.com https://clerk.nidhiclothing.com https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com;
      img-src 'self' data: https: blob: https://img.clerk.com;
      style-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      frame-src 'self' https://checkout.razorpay.com https://api.razorpay.com https://*.clerk.accounts.dev https://*.clerk.com https://clerk.nidhiclothing.com https://challenges.cloudflare.com;
      worker-src 'self' blob: https://*.clerk.accounts.dev https://*.clerk.com https://clerk.nidhiclothing.com;
      child-src 'self' blob: https://*.clerk.accounts.dev https://*.clerk.com https://clerk.nidhiclothing.com;
      base-uri 'self';
      form-action 'self' https://checkout.razorpay.com;
      object-src 'none';
      upgrade-insecure-requests;
    " />

    <!--
      Resource Hints Priority Order:
      1. Preconnect to critical origins (fonts, auth, real-time data)
      2. DNS prefetch for secondary origins (analytics, payments)
      3. Preload critical resources (fonts, critical CSS)
    -->

    <!-- Preconnect to critical third-party origins (establish early connections) -->
    <!-- Order matters: most critical first. Max 4 preconnects to avoid contention. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Convex real-time data - critical for initial render -->
    <link rel="preconnect" href="https://convex.cloud" crossorigin />
    <!-- Clerk authentication (custom domain - used for SDK loading) -->
    <link rel="preconnect" href="https://clerk.nidhiclothing.com" />

    <!-- DNS Prefetch for secondary origins (payment) -->
    <link rel="dns-prefetch" href="https://checkout.razorpay.com" />
    <link rel="dns-prefetch" href="https://api.razorpay.com" />

    <!--
      Font loading optimization using media="print" swap trick
      This prevents render-blocking while still loading fonts early.
      The onload handler swaps media to "all" once loaded.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback for browsers with JS disabled -->

    </noscript>

    <!--
      Hero Image LCP Optimization:
      =========================================================================
      The hero image is optimized for LCP using attributes in HeroSection.tsx:
      - fetchpriority="high" - Tells browser to prioritize this image
      - loading="eager" - Ensures immediate loading (not lazy)
      - decoding="sync" - Synchronous decode for fastest paint

      A custom Vite plugin (heroPreloadPlugin in vite.config.ts) automatically
      injects <link rel="preload" as="image" imagesrcset="..."> with the correct
      hashed filenames at build time. This eliminates the JS-dependency chain delay
      by letting the browser discover the hero image directly from the HTML <head>.
    -->

      :root {

    <script type="module">
      // Report Web Vitals metrics in development
      if ('PerformanceObserver' in window) {
        // Observe Largest Contentful Paint
        try {
          const lcpObserver = new PerformanceObserver((list) => {
            const entries = list.getEntries();
            const lastEntry = entries[entries.length - 1];
            if (window.__WEB_VITALS_DEBUG__) {
              console.log('LCP:', lastEntry.startTime.toFixed(0), 'ms');
            }
          });
          lcpObserver.observe({ type: 'largest-contentful-paint', buffered: true });
        } catch (e) {
          // LCP not supported
        }

        // Observe Interaction to Next Paint (INP - replaced FID as Core Web Vital in March 2024)
        try {
          let maxINP = 0;
          const inpObserver = new PerformanceObserver((list) => {
            const entries = list.getEntries();
            entries.forEach((entry) => {
              if (entry.duration > maxINP) {
                maxINP = entry.duration;
              }
              if (window.__WEB_VITALS_DEBUG__) {
                console.log('INP candidate:', entry.duration.toFixed(0), 'ms', '(max:', maxINP.toFixed(0), 'ms)');
              }
            });
          });
          inpObserver.observe({ type: 'event', buffered: true, durationThreshold: 40 });
        } catch (e) {
          // INP not supported
        }

        // Observe Cumulative Layout Shift
        try {
          let clsValue = 0;
          const clsObserver = new PerformanceObserver((list) => {
            for (const entry of list.getEntries()) {
              if (!entry.hadRecentInput) {
                clsValue += entry.value;
              }
            }
            if (window.__WEB_VITALS_DEBUG__) {
              console.log('CLS:', clsValue.toFixed(3));
            }
          });
          clsObserver.observe({ type: 'layout-shift', buffered: true });
        } catch (e) {
          // CLS not supported
        }
      }
    </script>
