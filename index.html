<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLOCKHAUS - Modern Streetwear Collection</title>
    <meta name="description" content="Redefine your look with BLOCKHAUS premium streetwear. Shop the latest collection with 25% off signatures." />
    <meta name="author" content="BLOCKHAUS" />

    <!--
      SECURITY: Content Security Policy (CSP)
      =========================================================================
      CSP provides defense-in-depth against XSS and data injection attacks.

      Directives explained:
      - default-src 'self': Only allow resources from same origin by default
      - script-src: Allow scripts from self, inline (required for React/Vite), Razorpay, Sentry, and Clerk
      - script-src-elem: Explicit directive for script elements (some browsers require this)
      - connect-src: Allow API calls to Convex, Clerk auth, Razorpay, and Sentry
      - img-src: Allow images from self, data URIs, HTTPS sources (CDNs, user avatars)
      - style-src: Allow styles from self, inline (required for styled-components/Tailwind)
      - font-src: Allow fonts from self and Google Fonts
      - frame-src: Allow iframes from Razorpay checkout and Clerk (for auth modals)
      - base-uri: Restrict base element to prevent base tag hijacking
      - form-action: Restrict form submissions to same origin
      - object-src: Disallow plugins (Flash, Java, etc.)
      - upgrade-insecure-requests: Auto-upgrade HTTP to HTTPS

      IMPORTANT: frame-ancestors directive is NOT included here because it is
      ignored when delivered via <meta> element (browser security restriction).
      For clickjacking protection, configure frame-ancestors in your HTTP headers:
        Content-Security-Policy: frame-ancestors 'self';
      This should be set in your web server config (nginx, Vercel, etc.)

      Note: 'unsafe-inline' for scripts is required for Vite HMR in development.
      Consider using nonces or hashes in production for stricter CSP.

      Clerk Proxy Domain: clerk.nishaniwoolera.in is the custom proxy for Clerk auth.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://browser.sentry-cdn.com https://js.sentry-cdn.com https://*.clerk.accounts.dev https://clerk.nishaniwoolera.in https://*.clerk.com;
      script-src-elem 'self' 'unsafe-inline' https://checkout.razorpay.com https://browser.sentry-cdn.com https://js.sentry-cdn.com https://*.clerk.accounts.dev https://clerk.nishaniwoolera.in https://*.clerk.com;
      connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://*.clerk.dev https://*.clerk.com https://*.clerk.accounts.dev https://clerk.nishaniwoolera.in https://api.razorpay.com https://*.sentry.io;
      img-src 'self' data: https: blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      frame-src https://checkout.razorpay.com https://api.razorpay.com https://*.clerk.accounts.dev https://clerk.nishaniwoolera.in;
      base-uri 'self';
      form-action 'self';
      object-src 'none';
      upgrade-insecure-requests;
    " />

    <meta property="og:title" content="BLOCKHAUS - Modern Streetwear Collection" />
    <meta property="og:description" content="Redefine your look with BLOCKHAUS premium streetwear" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@blockhaus" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!--
      Resource Hints Priority Order:
      1. Preconnect to critical origins (fonts, auth, real-time data)
      2. DNS prefetch for secondary origins (analytics, payments)
      3. Preload critical resources (fonts, critical CSS)
    -->

    <!-- Preconnect to critical third-party origins (establish early connections) -->
    <!-- Order matters: most critical first -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Convex real-time data - critical for initial render -->
    <link rel="preconnect" href="https://convex.cloud" crossorigin />
    <!-- Clerk authentication (proxy domain for production) -->
    <link rel="preconnect" href="https://clerk.nishaniwoolera.in" crossorigin />
    <link rel="preconnect" href="https://clerk.com" crossorigin />
    <link rel="preconnect" href="https://img.clerk.com" crossorigin />

    <!-- DNS Prefetch for secondary origins (payment, analytics) -->
    <link rel="dns-prefetch" href="https://checkout.razorpay.com" />
    <link rel="dns-prefetch" href="https://api.razorpay.com" />
    <link rel="dns-prefetch" href="https://browser.sentry-cdn.com" />

    <!--
      Font loading optimization using media="print" swap trick
      This prevents render-blocking while still loading fonts early.
      The onload handler swaps media to "all" once loaded.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback for browsers with JS disabled -->
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!--
      Hero Image LCP Optimization:
      =========================================================================
      The hero image is optimized for LCP using attributes in HeroSection.tsx:
      - fetchpriority="high" - Tells browser to prioritize this image
      - loading="eager" - Ensures immediate loading (not lazy)
      - decoding="sync" - Synchronous decode for fastest paint

      NOTE: Static <link rel="preload"> is NOT used because vite-imagetools
      generates hashed filenames in production (e.g., hero-blockhaus-C9a-omDe.jpg)
      that don't match development paths (/src/assets/...). A static preload
      would preload a non-existent resource in production, causing warnings
      and wasted bandwidth.

      For advanced preloading, consider vite-plugin-html to inject the correct
      hashed paths dynamically during build.
    -->

    <!-- Inline critical CSS for faster FCP -->
    <style>
      /* Critical CSS for initial render - Above the fold styles */
      :root {
        --font-fallback: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        /* Predefine theme colors to prevent FOUC */
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        font-family: 'Space Grotesk', var(--font-fallback);
        line-height: 1.5;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
      }
      /* Prevent layout shift from font loading */
      .font-loading body {
        font-family: var(--font-fallback);
      }
      /* Loading skeleton to prevent CLS and improve perceived performance */
      #root:empty {
        min-height: 100vh;
        background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root:empty::before {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid #e0e0e0;
        border-top-color: #333;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <!--
      Main entry point with high fetch priority
      type="module" enables native ES modules and tree-shaking
    -->
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Web Vitals performance monitoring (development only)
      Enable by setting window.__WEB_VITALS_DEBUG__ = true in console
    -->
    <script type="module">
      // Report Web Vitals metrics in development
      if ('PerformanceObserver' in window) {
        // Observe Largest Contentful Paint
        try {
          const lcpObserver = new PerformanceObserver((list) => {
            const entries = list.getEntries();
            const lastEntry = entries[entries.length - 1];
            if (window.__WEB_VITALS_DEBUG__) {
              console.log('LCP:', lastEntry.startTime.toFixed(0), 'ms');
            }
          });
          lcpObserver.observe({ type: 'largest-contentful-paint', buffered: true });
        } catch (e) {
          // LCP not supported
        }

        // Observe First Input Delay
        try {
          const fidObserver = new PerformanceObserver((list) => {
            const entries = list.getEntries();
            entries.forEach((entry) => {
              if (window.__WEB_VITALS_DEBUG__) {
                console.log('FID:', entry.processingStart - entry.startTime, 'ms');
              }
            });
          });
          fidObserver.observe({ type: 'first-input', buffered: true });
        } catch (e) {
          // FID not supported
        }

        // Observe Cumulative Layout Shift
        try {
          let clsValue = 0;
          const clsObserver = new PerformanceObserver((list) => {
            for (const entry of list.getEntries()) {
              if (!entry.hadRecentInput) {
                clsValue += entry.value;
              }
            }
            if (window.__WEB_VITALS_DEBUG__) {
              console.log('CLS:', clsValue.toFixed(3));
            }
          });
          clsObserver.observe({ type: 'layout-shift', buffered: true });
        } catch (e) {
          // CLS not supported
        }
      }
    </script>
  </body>
</html>
